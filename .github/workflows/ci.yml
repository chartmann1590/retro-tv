name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile *.py scripts/*.py tests/*.py

      - name: JavaScript syntax check
        run: |
          for file in static/js/*.js; do node --check "$file"; done

      - name: Validate gettext extraction and POT coverage
        run: |
          pybabel extract -F babel.cfg -o /tmp/retro-tv-extracted.pot .
          python scripts/check_i18n_catalog.py /tmp/retro-tv-extracted.pot translations/messages.pot

      - name: Compile gettext catalogs
        run: pybabel compile -d translations

      - name: Parse Jinja templates
        run: |
          python -c "from jinja2 import Environment, FileSystemLoader; env = Environment(loader=FileSystemLoader('templates'), extensions=['jinja2.ext.i18n']); [env.get_template(name) for name in env.list_templates()]"

      - name: Shell syntax check
        run: bash -n scripts/install.sh scripts/kiosk.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v
